name: CodeCausality PR Impact
description: Analyze pull-request change impact, architecture guardrails, and recommended tests.
author: Aetherexa

inputs:
  base-ref:
    description: Base Git ref to compare against. Defaults to GITHUB_BASE_REF or main.
    required: false
    default: ''
  report-path:
    description: Repository-relative JSON report output path.
    required: false
    default: .codecausality/impact.json
  fail-on-architecture-error:
    description: Fail the action when an error-severity architecture violation is detected.
    required: false
    default: 'false'

outputs:
  impact-score:
    description: Combined CodeCausality impact score.
    value: ${{ steps.publish.outputs.impact-score }}
  risk-level:
    description: Combined impact risk level.
    value: ${{ steps.publish.outputs.risk-level }}
  architecture-errors:
    description: Number of error-severity architecture violations.
    value: ${{ steps.publish.outputs.architecture-errors }}
  recommended-tests:
    description: Number of recommended tests.
    value: ${{ steps.publish.outputs.recommended-tests }}
  report-path:
    description: Absolute path to the generated CodeCausality report.
    value: ${{ steps.publish.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Resolve comparison base
      id: base
      shell: bash
      run: |
        BASE_REF="${{ inputs.base-ref }}"
        if [ -z "$BASE_REF" ]; then
          BASE_REF="${GITHUB_BASE_REF:-main}"
        fi
        echo "base-ref=$BASE_REF" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        corepack prepare pnpm@10.17.1 --activate

    - name: Install CodeCausality
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --no-frozen-lockfile

    - name: Build CodeCausality CLI
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm build:packages

    - name: Fetch base ref
      shell: bash
      run: |
        git -C "$GITHUB_WORKSPACE" fetch origin "${{ steps.base.outputs.base-ref }}" --depth=1

    - name: Analyze PR impact
      shell: bash
      env:
        BASE_REF: ${{ steps.base.outputs.base-ref }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/$(dirname "$REPORT_PATH")"
        node "${{ github.action_path }}/packages/cli/dist/index.js" impact \
          --since "origin/$BASE_REF" \
          --repo "$GITHUB_WORKSPACE" \
          --format json \
          --output "$GITHUB_WORKSPACE/$REPORT_PATH" \
          > "$RUNNER_TEMP/codecausality-output.json"

    - name: Publish CodeCausality summary
      id: publish
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
        FAIL_ON_ARCHITECTURE_ERROR: ${{ inputs.fail-on-architecture-error }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');

        const reportPath = path.resolve(process.env.GITHUB_WORKSPACE, process.env.REPORT_PATH);
        const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
        const architectureErrors = report.architectureViolations.filter(
          (item) => item.severity === 'error',
        ).length;
        const recommendedTests = report.recommendedTests.length;

        const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
        const repository = process.env.GITHUB_REPOSITORY || '';
        const commitSha = process.env.GITHUB_SHA || 'HEAD';
        const repositoryUrl = repository ? `${serverUrl}/${repository}` : '';

        const encodeRepoPath = (filePath) =>
          filePath
            .split('/')
            .map((segment) => encodeURIComponent(segment))
            .join('/');

        const fileUrl = (filePath) =>
          repositoryUrl
            ? `${repositoryUrl}/blob/${encodeURIComponent(commitSha)}/${encodeRepoPath(filePath)}`
            : '';

        const commitUrl = (sha) =>
          repositoryUrl && sha ? `${repositoryUrl}/commit/${encodeURIComponent(sha)}` : '';

        const fileLink = (filePath) => {
          const url = fileUrl(filePath);
          return url ? `[${filePath}](${url})` : `\`${filePath}\``;
        };

        const commitLink = (sha) => {
          const url = commitUrl(sha);
          return url ? `[${sha.slice(0, 7)}](${url})` : sha?.slice(0, 7) ?? 'unknown';
        };

        fs.appendFileSync(
          process.env.GITHUB_OUTPUT,
          [
            `impact-score=${report.impact.impactScore}`,
            `risk-level=${report.impact.riskLevel}`,
            `architecture-errors=${architectureErrors}`,
            `recommended-tests=${recommendedTests}`,
            `report-path=${reportPath}`,
            '',
          ].join('\n'),
        );

        const changedFileLines = report.impact.foundTargets
          .slice(0, 15)
          .map((file) => `- ${fileLink(file)}`);

        const affectedFileLines = report.impact.affectedFiles
          .filter((file) => !report.impact.foundTargets.includes(file))
          .slice(0, 15)
          .map((file) => `- ${fileLink(file)}`);

        const recommendedTestLines = report.recommendedTests.map(
          (test) =>
            `- **${test.confidence.toUpperCase()}** — ${fileLink(test.path)} (${test.reasons.join(', ')})`,
        );

        const architectureLines = report.architectureViolations.map(
          (item) =>
            `- **${item.severity.toUpperCase()}** — ${item.ruleName}: ${fileLink(item.from)} → ${fileLink(item.to)}`,
        );

        const historyLines = report.history
          .filter((item) => item.commitCount > 0)
          .sort((a, b) => b.churn - a.churn)
          .slice(0, 10)
          .map(
            (item) =>
              `- ${fileLink(item.file)} — ${item.commitCount} commit(s), churn ${item.churn}, last touched by **${item.lastAuthor ?? 'unknown'}** in ${commitLink(item.lastCommitSha)}`,
          );

        const summary = [
          '# CodeCausality PR Impact',
          '',
          '| Signal | Result |',
          '| --- | --- |',
          `| Risk | **${report.impact.riskLevel}** (${report.impact.impactScore}/100) |`,
          `| Changed source files | ${report.impact.foundTargets.length} |`,
          `| Affected files | ${report.impact.affectedFiles.length} |`,
          `| Affected modules | ${report.impact.affectedModules.length} |`,
          `| Architecture violations | ${report.architectureViolations.length} (${architectureErrors} errors) |`,
          `| Recommended tests | ${recommendedTests} |`,
          '',
          '## Changed source files',
          '',
          ...(changedFileLines.length ? changedFileLines : ['- No changed source files found.']),
          '',
          '## Downstream affected files',
          '',
          ...(affectedFileLines.length
            ? affectedFileLines
            : ['- No additional downstream files identified.']),
          '',
          '## Recommended tests',
          '',
          ...(recommendedTestLines.length
            ? recommendedTestLines
            : ['- No deterministic test recommendations.']),
          '',
          '## Architecture guardrails',
          '',
          ...(architectureLines.length
            ? architectureLines
            : ['- No relevant architecture violations.']),
          '',
          '## History evidence',
          '',
          ...(historyLines.length ? historyLines : ['- No tracked history evidence available.']),
          '',
          `Report artifact source: \`${process.env.REPORT_PATH}\``,
          `Evidence ref: \`${commitSha}\``,
          '',
        ].join('\n');

        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

        if (
          process.env.FAIL_ON_ARCHITECTURE_ERROR.toLowerCase() === 'true' &&
          architectureErrors > 0
        ) {
          console.error(
            `CodeCausality found ${architectureErrors} error-severity architecture violation(s).`,
          );
          process.exit(2);
        }
        NODE
