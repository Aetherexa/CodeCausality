name: VS Code Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate repository
        run: pnpm check

      - name: Build VSIX
        run: pnpm package:vsix

      - name: Inspect VSIX
        run: ls -lh artifacts/codecausality.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: codecausality-vscode
          path: artifacts/codecausality.vsix
          if-no-files-found: error
          retention-days: 30
