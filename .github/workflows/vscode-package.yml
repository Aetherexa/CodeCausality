name: VS Code Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository
        run: npm run quality

      - name: Build VSIX
        run: npm run package:vscode

      - name: Inspect VSIX
        shell: bash
        run: |
          VSIX="$(find packages/vscode -maxdepth 1 -name 'codecausality-*.vsix' -print -quit)"
          test -n "$VSIX"
          echo "VSIX=$VSIX"
          ls -lh "$VSIX"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: codecausality-vscode
          path: packages/vscode/codecausality-*.vsix
          if-no-files-found: error
          retention-days: 30
