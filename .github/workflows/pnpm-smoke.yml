name: pnpm Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-smoke:
    name: pnpm / Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version

      - name: Install workspace with pnpm
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Check
        shell: pwsh
        run: pnpm check

      - name: Package VSIX
        shell: pwsh
        run: pnpm package:vsix

      - name: Verify VSIX
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/codecausality-1.0.4.vsix")) {
            throw "VSIX was not generated"
          }
          Write-Host "Generated artifacts/codecausality-1.0.4.vsix"
