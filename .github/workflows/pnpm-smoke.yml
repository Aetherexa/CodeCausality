name: pnpm Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-smoke:
    name: pnpm / Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version

      - name: Install workspace with pnpm
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Check
        shell: pwsh
        run: pnpm check

      - name: Package VSIX
        shell: pwsh
        run: pnpm package:vsix

      - name: Verify VSIX
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/codecausality.vsix")) {
            throw "VSIX was not generated"
          }
          Write-Host "Generated artifacts/codecausality.vsix"
