name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "release/**"
      - "refactor/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.17.1"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run repository quality gate
        run: pnpm check

      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Package VSIX
        run: pnpm package:vsix

      - name: Resolve extension version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/vscode/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp artifacts/codecausality.vsix "artifacts/codecausality-$VERSION.vsix"

      - name: Verify VSIX
        shell: bash
        run: test -f "artifacts/codecausality-${{ steps.meta.outputs.version }}.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codecausality-v${{ steps.meta.outputs.version }}-vsix
          path: artifacts/codecausality-${{ steps.meta.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 14
