name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run quality
      - name: Package VS Code extension
        run: npm run package:vscode
      - name: Verify VSIX
        shell: bash
        run: |
          test -n "$(find packages/vscode -maxdepth 1 -name 'codecausality-*.vsix' -print -quit)"
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: codecausality-vsix
          path: packages/vscode/codecausality-*.vsix
          retention-days: 7
